[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edamame-downstream"
version = "0.1.0"
description = "Pretrained Foundation Models for Physiological Data Analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Leonardo Alchieri", email = "leonardo.alchieri@usi.ch"}
]
keywords = ["machine learning", "time series", "physiological signals", "EDA", "foundation models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "tqdm>=4.62.0",
    "torch>=2.0.0",
    "hydra-core>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "imbalanced-learn>=0.9.0",
    "neurokit2>=0.2.0",
    "PyWavelets>=1.1.0",
    "transformers>=4.30.0",
    "huggingface_hub>=0.16.0",
    "pytorch-lightning>=2.0.0",
    "scikit-posthocs>=0.7.0",
    "tslearn>=0.5.0",
    "tensorflow>=2.10.0",
    "sktime>=0.20.0",
    "chronos-forecasting>=0.1.0",
    "mantis-tsfm>=0.1.0",
    "hydra-list-sweeper>=1.0.0",
    "jmetalpy>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
notebooks = [
    "notebook>=6.5.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/LeonardoAlchieri/pretrained_foundation_models_physiological_data"
Repository = "https://github.com/LeonardoAlchieri/pretrained_foundation_models_physiological_data"
Documentation = "https://github.com/LeonardoAlchieri/pretrained_foundation_models_physiological_data/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["edamame_downstream*"]
exclude = ["tests*", "docs*", "additional_notebook*", "notebooks*", "configs*", "outputs*", "data.nosync*"]

[tool.setuptools.package-data]
edamame_downstream = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.env
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=edamame_downstream --cov-report=term-missing"
