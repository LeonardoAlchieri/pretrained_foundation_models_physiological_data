[workspace]
channels = ["conda-forge"]
name = "pretrained_foundation_models_physiological_data"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.10"
pandas = "<3.0"
pytorch = ">=2.6.0,<3"
pytorch-lightning = ">=2.6.1,<3"
hydra-core = ">=1.3.2,<2"
neurokit2 = ">=0.2.13,<0.3"
notebook = ">=7.5.5,<8"
tensorflow = ">=2.18.0,<3"
scipy = ">=1.17.1,<2"
tqdm = ">=4.67.3,<5"
sktime = ">=0.40.1,<0.41"
numba = ">=0.64.0,<0.65"
fvcore = ">=0.1.5.post20221221,<0.2"
iopath = ">=0.1.10,<0.2"
xgboost = ">=3.2.0,<4"

[pypi-dependencies]
mantis-tsfm = ">=1.0.0, <2"
chronos-forecasting = ">=2.2.2, <3"
hydra-list-sweeper = ">=1.1.0, <2"
imblearn = ">=0.0, <0.1"
scikit-posthocs = ">=0.12.0, <0.13"
jmetalpy = ">=1.9.0, <2"
edamame = { path = "../eda-foundation-models/.", editable = true }
momentfm = {git = "git+https://github.com/moment-timeseries-foundation-model/moment.git"}
