defaults:
  - default
  # - sweeps@_here_: basic-local
  - override dataset: edabe
  - override label_processor: custom_selector
  - _self_

label_name: artifact # accepted: cognitiveload
dataset.side: unknown # accepted: right, left
segment_length: 60 # in seconds
device_map: "mps" # accepted: "cpu", "cuda", "mps"
# FIXME: device_map is not working
# NOTE: edamame does not support mps. I need to fix it.

label_processor:
  positive_class: [1, 2]
  negative_class: [0]

datamodule:
  recompute_features: true
#   channels: [1, 2] # 0 mixed, 1 phasic, 2 tonic
#   sample_scaling_method: 
#     _target_: edamame.utils.sample_scaling.min_max_scaling
#     _partial_: true
